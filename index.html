<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="孔德章的学术主页，聚焦网络/AI基础设施安全与可信测量。">
  <title>孔德章 | 学术主页</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="assets/js/content.js"></script>
  <script defer src="assets/js/site.js"></script>
</head>
<body>
  <div class="page-noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#top" aria-label="返回顶部">
      <span id="brand-initials">DK</span>
    </a>
    <div class="header-actions">
      <button class="language-toggle" id="language-toggle" type="button" aria-label="切换到英文">
        English
      </button>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        菜单
      </button>
      <nav class="site-nav" id="site-nav" aria-label="主导航">
        <a id="nav-about" href="#about">关于我</a>
        <a id="nav-education" href="#education">经历</a>
        <a id="nav-news" href="#news">近期</a>
        <a id="nav-publications" href="#publications">成果</a>
        <a id="nav-projects" href="#projects">开源项目</a>
        <a id="nav-experience" href="#experience">服务</a>
      </nav>
    </div>
  </header>

  <main class="page-shell" id="top">
    <aside class="profile-panel reveal">
      <div class="portrait-wrap">
        <img id="profile-avatar" src="assets/images/avatar-placeholder.svg" alt="孔德章头像">
      </div>
      <p class="profile-kicker" id="profile-role"></p>
      <h1 id="profile-name">孔德章</h1>
      <p class="profile-affiliation" id="profile-affiliation">浙江大学计算机科学与技术学院</p>
      <p class="profile-location" id="profile-location"></p>
      <p class="profile-contact" id="profile-contact"></p>
      <a class="profile-linkline" id="profile-scholar" href="#" target="_blank" rel="noreferrer"></a>
    </aside>

    <div class="content-column">
      <section class="section-card reveal" id="about">
        <div class="section-heading">
          <p class="section-kicker" id="about-kicker"></p>
          <h2 id="about-title">关于我</h2>
        </div>
        <div class="prose-block" id="about-content"></div>
      </section>

      <section class="section-card reveal" id="education">
        <div class="section-heading">
          <p class="section-kicker" id="education-kicker"></p>
          <h2 id="education-title">经历</h2>
        </div>
        <div class="entry-list" id="education-list"></div>
      </section>

      <section class="section-card reveal" id="news">
        <div class="section-heading">
          <p class="section-kicker" id="news-kicker"></p>
          <h2 id="news-title">近期</h2>
        </div>
        <div class="timeline-list" id="news-list"></div>
      </section>

      <section class="section-card reveal" id="publications">
        <div class="section-heading">
          <p class="section-kicker" id="publications-kicker"></p>
          <h2 id="publications-title">成果</h2>
        </div>
        <div class="publication-list" id="publication-list"></div>
      </section>

      <section class="section-card reveal" id="projects">
        <div class="section-heading">
          <p class="section-kicker" id="projects-kicker"></p>
          <h2 id="projects-title">开源项目</h2>
        </div>
        <div class="entry-list" id="project-list"></div>
      </section>

      <section class="section-card reveal" id="experience">
        <div class="section-heading">
          <p class="section-kicker" id="experience-kicker"></p>
          <h2 id="experience-title">服务</h2>
        </div>
        <div class="entry-list" id="experience-list"></div>
      </section>
    </div>
  </main>
</body>
</html>
